set -s escape-time 0
set-option -g focus-events on
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set-option -g renumber-windows on

# window operation
bind-key -n C-n next-window
bind-key -n C-p previous-window
bind-key -n C-f new-window

# mouse setting
set-window-option -g mouse on
bind-key -n MouseDown3Pane paste-buffer

# WSL only: right-click pastes from the Windows clipboard instead of the tmux
# buffer. The helper is resolved next to this config, so it works wherever the
# repo is cloned (the nix out-of-store symlink still points back here).
if-shell 'grep -qi microsoft /proc/version' {
  bind-key -n MouseDown3Pane run-shell -b 'sh "$(dirname "$(readlink -f "$HOME/.tmux.conf")")/wsl-paste.sh" "#{pane_id}"'
}

# statusbar setting (orange bar + bracket tabs — no nerd font needed)
set-option -g status-style bg="colour208",fg="colour255"
set-option -g status-left "#[bg=colour208,fg=colour0,bold] #S #[default] "
set-option -g status-right "#[bg=colour208,fg=colour0] %H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[bg=colour208,fg=colour223] #I:#W "
setw -g window-status-current-format "#[bg=colour223,fg=colour0,bold] ‹#I:#W› "

# Persist sessions, windows, pane layouts, and working directories.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run-shell ~/.nix-profile/share/tmux-plugins/resurrect/resurrect.tmux

# Serialize every save, avoid same-second snapshot collisions, and repair a
# dangling `last` link before restore. Override both plugin paths and bindings.
run-shell 'tmux set-option -g @resurrect-save-script-path "$HOME/.local/bin/tmux-resurrect-save-safe"'
run-shell 'tmux set-option -g @resurrect-restore-script-path "$HOME/.local/bin/tmux-resurrect-restore-safe"'
run-shell 'tmux bind-key C-s run-shell "$HOME/.local/bin/tmux-resurrect-save-safe"'
run-shell 'tmux bind-key C-r run-shell "$HOME/.local/bin/tmux-resurrect-restore-safe"'

run-shell ~/.nix-profile/share/tmux-plugins/continuum/continuum.tmux
